monitoring:
  interval: 60

thresholds:
  cpu:
    temperature:
      warning: 85
      critical: 95
      recovery: 75
      warning_duration: 120
      cooldown: 300

    usage:
      warning: 85
      critical: 95
      recovery: 75
      warning_duration: 120
      cooldown: 300
  
  ram:
    warning: 85
    critical: 95
    recovery: 80
    warning_duration: 120
    cooldown: 300

  disk:
    temperature:
      warning: 65
      critical: 75
      recovery: 55
      warning_duration: 120
      cooldown: 36000

    usage:
      warning: 80
      critical: 90
      recovery: 75
      warning_duration: 120
      cooldown: 36000

timeouts:
  smartctl: 10
  lsblk: 10
  docker: 10

docker:
  monitored_containers:
  - immich_server
  - immich_postgres
  - immich_redis
  - vaultwarden
  cooldown: 6000

http_services:
  interval: 60
  failure_duration: 120
  cooldown: 600
  monitored:
    vaultwarden:
      url: https://vault.example.com
      timeout: 10
      expected_status: [200]
    immich:
      url: https://immich.example.com
      timeout: 10
      expected_status: [200]

internet:
  url: https://example.com
  timeout: 10
  expected_status: [200]
  interval: 60
  failure_duration: 120
  cooldown: 600

logger:
  level: INFO
  format: "%(levelname)s | %(name)s | %(message)s"